<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Clinton Weather Cam</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe
  src="https://www.youtube.com/embed/o5kc_VR5yS4?autoplay=1&mute=1&controls=0&rel=0&playsinline=1"
  title="Clinton, TN weather camera"
  allow="autoplay; encrypted-media; picture-in-picture"
  referrerpolicy="strict-origin-when-cross-origin"
  allowfullscreen></iframe>
<script>
  // Reload every 6 hours so a stalled stream recovers on its own
  setTimeout(function () { location.reload(); }, 6 * 60 * 60 * 1000);
</script>
</body>
</html>
